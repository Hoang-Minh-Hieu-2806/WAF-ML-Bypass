name: waf-crs-lab
services:
  crs-audit-init:
    image: owasp/modsecurity-crs@sha256:133267aa811e1a57a23b52ef04b3c30e802bcbe5454588f6d6af1f69f4b2b667
    user: "0:0"
    entrypoint: ["/bin/sh", "/init-audit.sh"]
    network_mode: none
    read_only: true
    volumes:
      - ../../logs/waf/crs:/evidence
      - ./init-audit.sh:/init-audit.sh:ro

  crs-test-backend:
    build:
      context: ../..
      dockerfile: docker/waf-crs/Dockerfile.backend
    ports:
      - "127.0.0.1:${CRS_BACKEND_PORT:-18080}:8080"
    volumes:
      - ../../logs/application/crs:/evidence
    networks: [lab]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 30
  waf-crs:
    build:
      context: ../..
      dockerfile: docker/waf-crs/Dockerfile
    ports:
      - "127.0.0.1:${CRS_PORT:-18081}:8080"
    environment:
      BACKEND: http://crs-test-backend:8080
      PORT: "8080"
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: "On"
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_ACCESS: "Off"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: ABIJDEFHZ
      MODSEC_AUDIT_LOG: /var/log/crs-lab/audit.log
      BLOCKING_PARANOIA: "${CRS_PL:-1}"
      DETECTION_PARANOIA: "${CRS_PL:-1}"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      CRS_DISABLE_PLUGINS: "1"
      NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ../../logs/waf/crs:/var/log/crs-lab
    depends_on:
      crs-test-backend:
        condition: service_healthy
      crs-audit-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:8080/healthz && test -w /var/log/crs-lab/audit.log && test -s /var/log/crs-lab/audit.log"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [lab]
networks:
  lab:
    driver: bridge
